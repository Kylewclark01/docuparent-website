<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading DocuParent Preview…</title><style>body{font:16px system-ui;background:#f3f7fc;color:#0d2442;padding:25px}a{color:#1458bb}</style></head><body><p id="status">Loading the actual DocuParent website preview…</p><script>
(async()=>{
try{
 const response=await fetch('/?preview_source=v80',{cache:'no-store'});
 if(!response.ok)throw Error('Homepage returned '+response.status);
 let page=await response.text();
 const start=page.indexOf('<section class="modern-demo" id="explore">');
 const end=page.indexOf('</section>',start);
 if(start<0||end<0)throw Error('Expected PPDS workspace section not found');
 const compact=`<section class="modern-demo" id="explore" style="padding:42px 18px;background:#f3f7fd">
 <div style="max-width:1060px;margin:auto">
 <div class="modern-kicker">INTERACTIVE WORKSPACE · COMPACT PREVIEW</div>
 <h2 style="margin:10px 0 12px">Explore PPDS in Minutes</h2>
 <p style="margin:0 0 22px;max-width:780px">A quick look at how PPDS helps you document, organize and prepare information—without scrolling through the full report.</p>
 <div id="ppds-short-preview" style="display:grid;grid-template-columns:minmax(210px,310px) 1fr;gap:14px">
 <div class="ppds-short-tabs" style="display:grid;gap:9px;align-content:start">
 <button data-demo-feature="Observations" class="chosen">🔭 Observations</button>
 <button data-demo-feature="Communications">📱 Communications</button>
 <button data-demo-feature="Evidence Vault">🗄️ Evidence Vault</button>
 <button data-demo-feature="Case Builder">💼 Case Builder</button>
 </div>
 <div class="ppds-short-detail" style="background:white;border:1px solid #d5e3f3;border-radius:14px;padding:22px;min-height:180px">
 <div style="font-size:12px;color:#326bb3;font-weight:800;letter-spacing:1px">PPDS · SAMPLE WORKSPACE</div>
 <h3 id="short-title" style="font-size:24px;margin:12px 0">Observations</h3>
 <p id="short-desc">Record important events, dates and details in one organized place.</p>
 <div style="background:#f2f7fe;padding:15px;border-radius:10px;margin-top:15px"><strong id="short-example">School Event · October 3</strong><div id="short-extra" style="margin-top:6px;font-size:13px;color:#506985">Example observation with related supporting records.</div></div>
 </div></div>
 <a href="/demo.html" style="display:block;background:#1e5cc4;color:white;text-align:center;text-decoration:none;border-radius:10px;padding:15px;font-weight:800;max-width:450px;margin:22px auto 0">Explore the Full PPDS Workspace ↗</a>
 <p style="text-align:center;font-size:12px;color:#59708a">The full demonstration opens separately. <a href="#contact">Continue to Join the Beta</a></p>
 </div></section>`;
 page=page.slice(0,start)+compact+page.slice(end+10);
 page=page.replace(/src="\.\/demo\.html"/g,'src="/demo.html"');
 const style=`<style id="ppds-v80-fix">
 #ppds-short-preview button{padding:15px;text-align:left;background:#fff;color:#153154;border:1px solid #cbdcf0;border-radius:10px;font-weight:700;cursor:pointer;font-size:15px}
 #ppds-short-preview button.chosen{background:#1e5cc4;color:#fff}
 @media(max-width:650px){#ppds-short-preview{grid-template-columns:1fr!important}#ppds-short-preview .ppds-short-tabs{grid-template-columns:1fr 1fr}#ppds-short-preview button{padding:12px 7px;font-size:12px}}
 </style>`;
 const behavior=`<script>(function(){const data={'Observations':['Record important events, dates and details in one organized place.','School Event · October 3','Example observation with related supporting records.'],'Communications':['Keep messages and conversations organized for later reference.','Parenting Schedule Message','Example dated conversation with context.'],'Evidence Vault':['Keep supporting documents and files connected to your records.','School Notice.pdf','Example evidence linked to an observation.'],'Case Builder':['Prepare organized summaries and reports when you need them.','Sample Parenting Case Report','The full demonstration includes the detailed sample report.']};document.querySelectorAll('[data-demo-feature]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-demo-feature]').forEach(x=>x.classList.toggle('chosen',x===b));const key=b.dataset.demoFeature;document.getElementById('short-title').textContent=key;document.getElementById('short-desc').textContent=data[key][0];document.getElementById('short-example').textContent=data[key][1];document.getElementById('short-extra').textContent=data[key][2]}))})();<\/script>`;
 page=page.replace('</head>',style+'</head>').replace('</body>',behavior+'</body>');
 document.open();document.write(page);document.close();
}catch(err){document.getElementById('status').innerHTML='Unable to load the preview: '+String(err.message)+'. <a href="/">Open the live DocuParent website</a>.'}
})();</script></body></html>
